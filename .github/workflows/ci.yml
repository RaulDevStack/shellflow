name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (unit + ConPTY integration)
        run: dotnet test tests/ShellFlow.Tests -c Release

      - name: Build app (x64)
        run: dotnet build src/ShellFlow.App -c Release -p:Platform=x64

      - name: Build app (ARM64)
        run: dotnet build src/ShellFlow.App -c Release -p:Platform=ARM64
