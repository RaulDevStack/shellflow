name: Release

# Push a tag like v0.2.0 (matching <Version> in Directory.Build.props) to build and publish a GitHub release
# with the MSI installer, the portable zip and SHA256 checksums.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version." }

      - name: Build release assets
        shell: powershell
        run: .\build\release.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          $prerelease = if ($tag -match '^v0\.') { @('--prerelease') } else { @() }
          if (gh release view $tag 2>$null) {
            gh release upload $tag (Get-ChildItem artifacts/release/*).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem artifacts/release/*).FullName --title "ShellFlow $($tag.TrimStart('v'))" @notesArgs @prerelease
          }
